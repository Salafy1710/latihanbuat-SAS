<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Latihan Layout Grid</title>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <!-- Card Container menggunakan Grid -->
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-4xl grid grid-cols-4 grid-rows-3 gap-4 h-[480px]">
      
      <!-- Kotak 1 (Kiri Atas) -->
      <div class="col-span-2 row-span-2 bg-blue-400 rounded-xl flex items-center justify-center text-white font-bold text-lg">
        Kotak 1
      </div>

      <!-- Kotak 2 (Kiri Bawah) -->
      <div class="col-start-1 row-start-3 bg-purple-400 rounded-xl flex items-center justify-center text-white font-bold text-lg">
        Kotak 2
      </div>

      <!-- Kotak 3 (Tengah Kiri Bawah) -->
      <div class="col-start-2 row-start-3 bg-purple-400 rounded-xl flex items-center justify-center text-white font-bold text-lg">
        Kotak 3
      </div>

      <!-- Kotak 4 (Tengah Kanan Atas) -->
      <div class="col-start-3 row-start-1 bg-sky-400 rounded-xl flex items-center justify-center text-white font-bold text-lg">
        Kotak 4
      </div>

      <!-- Kotak 5 (Kanan Atas) -->
      <div class="col-start-4 row-start-1 bg-sky-400 rounded-xl flex items-center justify-center text-white font-bold text-lg">
        Kotak 5
      </div>

      <!-- Kotak 6 (Kanan Bawah) -->
      <div class="col-span-2 row-span-2 col-start-3 row-start-2 bg-blue-800 rounded-xl flex items-center justify-center text-white font-bold text-lg">
        Kotak 6
      </div>

    </div>

  </body>
</html>
